# Publish yotown-gym to PyPI when a version tag (v0.2.3, ...) is pushed.
#
# PyPI trusts this workflow by name (trusted publishing): no token is stored anywhere. The publish
# job runs in the `pypi` environment, which PyPI's publisher entry names too.
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag is the version in pyproject.toml
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' pyproject.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, pyproject.toml $version"; exit 1; }
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/yotown-gym/
    permissions:
      id-token: write                 # what trusted publishing signs in with
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
