[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "yotown-gym"
version = "0.2.2"
description = "Robots as code: every printed part a CadQuery program, built on shared vendor parts and interfaces"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Yo.Town 3D", email = "help@yotown.com" }]
requires-python = ">=3.11"               # CadQuery 2.8 needs 3.11+
dependencies = ["cadquery>=2.4"]

[project.scripts]
gym = "yotown.gym.cli:main"

# the packages: src/yotown/... and vendors/ (installed as yotown.gym.vendors) are listed by setup.py,
# so a maker's new folder under vendors/ installs without editing this file
